[project]
name = "music-visualizer-player"
version = "0.1.0"
description = "Audio-driven music visualizer player with a desktop UI and a browser WebUI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "librosa>=0.11.0",
    "mutagen>=1.47.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "python-multipart>=0.0.9",
    "pyside6>=6.11.0",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
    "uvicorn>=0.30.0",
]

[project.scripts]
music-visualizer = "app.main:main"
music-visualizer-web = "app.webui.server:main"

[dependency-groups]
dev = [
    "httpx>=0.27.0",  # required by FastAPI's TestClient
    "pytest>=9.0.2",
    "ruff>=0.8.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.webui" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E9", "F", "B"]
ignore = [
    "B008",  # FastAPI's File(...) defaults are the intended idiom
    "B905",  # zip() strictness is not worth enforcing here
]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]  # package-level re-exports
