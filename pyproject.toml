[project]
name = "music-visualizer-player"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "librosa>=0.11.0",
    "mutagen>=1.47.0",
    "numpy>=2.4.4",
    "pillow>=12.2.0",
    "pyside6>=6.11.0",
    "pyside6-addons>=6.11.0",
    "pytest>=9.0.2",
    "scipy>=1.17.1",
    "soundfile>=0.13.1",
]

[project.scripts]
music-visualizer = "app.main:main"

[tool.uv]
package = true

[tool.setuptools]
packages = ["app"]

